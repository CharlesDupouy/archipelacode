<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ArchipelaCode</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/archipelago_icon128x128.png" alt="" class="brand-icon" width="18" height="18">
      <span class="brand-title">ArchipelaCode</span>
    </div>
    <div id="status-pill" class="status-indicator disconnected">
      <span class="status-dot"></span>
      <span id="status-text">Offline</span>
    </div>
  </header>

  <!-- Connect Section (Shown when disconnected) -->
  <section id="connect-section" class="connect-card">
    <h2 class="card-heading">Connect to Multiworld</h2>
    <div class="form-group">
      <label for="input-host">Host</label>
      <input type="text" id="input-host" value="localhost" placeholder="localhost or archipelago.gg">
    </div>
    <div class="form-row">
      <div class="form-group flex-1">
        <label for="input-port">Port</label>
        <input type="number" id="input-port" value="38281" placeholder="38281">
      </div>
      <div class="form-group flex-2">
        <label for="input-slot">Slot Name</label>
        <input type="text" id="input-slot" value="Player1" placeholder="Player1">
      </div>
    </div>
    <div class="form-group">
      <label for="input-pass">Password</label>
      <input type="password" id="input-pass" placeholder="Optional">
    </div>
    <button id="btn-connect" class="btn btn-primary">Connect</button>
  </section>

  <!-- Active Session (Shown when connected) -->
  <main id="active-section" style="display: none;">
    <!-- Compact Goal Strip -->
    <section class="goal-strip">
      <div class="goal-meta">
        <div class="goal-info">
          <span class="goal-label">Goal Progress</span>
          <span id="goal-counter" class="goal-value">0 / 0</span>
        </div>
        <div class="goal-actions">
          <span id="deathlink-badge" class="badge-deathlink" style="display: none;">DeathLink</span>
          <button id="btn-disconnect" class="btn-link">Disconnect</button>
        </div>
      </div>
      <div class="meter-track">
        <div id="goal-progress-bar" class="meter-fill" style="width: 0%;"></div>
      </div>
      <div class="slot-row">
        <span id="slot-display" class="slot-text">Player1</span>
      </div>
    </section>

    <!-- Navigation List (Vertically Stacked) -->
    <nav class="nav-stack">
      <button class="nav-item active" data-tab="problems">
        <span class="nav-label">Problems Explorer</span>
        <span id="tab-badge-problems" class="nav-count">0</span>
      </button>
      <button class="nav-item" data-tab="inventory">
        <span class="nav-label">Inventory</span>
        <span id="tab-badge-inventory" class="nav-count">0 Items</span>
      </button>
      <button class="nav-item" data-tab="chat">
        <span class="nav-label">Multiworld Log</span>
      </button>
    </nav>

    <!-- Problems View -->
    <section id="tab-problems" class="tab-panel active">
      <div class="search-box">
        <input type="text" id="problem-search" placeholder="Filter problems by title..." class="search-input">
      </div>
      <div class="filter-group">
        <div class="segmented-control">
          <button class="filter-pill active" data-cat="Available">Available (<span id="count-available">0</span>)</button>
          <button class="filter-pill" data-cat="Solved">Solved (<span id="count-solved">0</span>)</button>
          <button class="filter-pill" data-cat="Locked">Locked (<span id="count-locked">0</span>)</button>
          <button class="filter-pill" data-cat="All">All (<span id="count-all">0</span>)</button>
        </div>
        <div class="diff-control">
          <button class="diff-btn active" data-diff="all">All</button>
          <button class="diff-btn diff-easy" data-diff="EASY">Easy</button>
          <button class="diff-btn diff-medium" data-diff="MEDIUM">Med</button>
          <button class="diff-btn diff-hard" data-diff="HARD">Hard</button>
        </div>
      </div>
      <div id="problems-list" class="problems-container">
        <!-- Rendered by sidepanel.ts -->
      </div>
    </section>

    <!-- Inventory View -->
    <section id="tab-inventory" class="tab-panel">
      <div class="inventory-container">
        <!-- Section 1: Received Multiworld Items -->
        <div class="section-title-row">
          <span class="section-title">Received Items</span>
          <span id="received-items-count" class="section-counter">0 Items</span>
        </div>
        <div id="received-items-list" class="received-items-container">
          <!-- Rendered by sidepanel.ts -->
        </div>

        <!-- Section 2: Problem Batch Progression -->
        <div class="section-title-row" style="margin-top: 10px;">
          <span class="section-title">Problem Batch Progression</span>
        </div>
        <div class="batch-card">
          <div class="batch-card-left">
            <span class="batch-title">Batches Accessible</span>
            <span id="prog-batch-detail" class="batch-subtitle">Starter Problems accessible</span>
          </div>
          <span id="prog-count" class="batch-value">1 / 5</span>
        </div>

        <!-- Section 3: Python 3 Syntax Features -->
        <div class="section-title-row" style="margin-top: 10px;">
          <span class="section-title">Python 3 Syntax Features</span>
          <span id="syntax-unlocked-count" class="section-counter">0 / 20 Available</span>
        </div>
        <div id="python-inventory-grid" class="features-grid">
          <!-- Rendered by sidepanel.ts -->
        </div>

        <div id="special-inventory-list" class="special-container" style="display: none;">
          <!-- Retained for compatibility -->
        </div>
      </div>
    </section>

    <!-- Chat / Log View -->
    <section id="tab-chat" class="tab-panel">
      <div id="chat-messages" class="log-stream">
        <!-- Rendered by sidepanel.ts -->
      </div>
      <div class="log-input-row">
        <input type="text" id="chat-input" placeholder="Send message, !hint, !status..." class="log-input">
        <button id="btn-send-chat" class="btn btn-secondary">Send</button>
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
